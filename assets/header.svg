<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Harshvardhan Chouhan: backend systems, data and open source" xmlns:c2pa="http://c2pa.org/manifest">
<title>Harshvardhan Chouhan</title>
<style>
.ln{fill:none;stroke:#9cc3e6;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.4,0,.2,1) forwards}
